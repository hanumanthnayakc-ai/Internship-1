<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ember &amp; Ash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky masthead with cart button, filter bar, auto-fill product grid, right-hand cart drawer (full width on phones). */
:root{
  --bg:#ecebf0; --surface:#ffffff; --surface-2:#e2e0e8; --fg:#1a161d; --muted:#625b6b;
  --line:#d3d0db; --accent:#d4301c; --accent-fg:#ffffff; --ok:#1f7a4a; --cap:#2a2630;
  --heat-on:#d4301c; --heat-off:#d3d0db;
  --font-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --font-body:"Work Sans","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131116; --surface:#1d1a21; --surface-2:#2a262f; --fg:#f1eef5; --muted:#a49cb0;
    --line:#35303c; --accent:#ff5a3d; --accent-fg:#1a0703; --ok:#58c98a; --cap:#d9d3e0;
    --heat-on:#ff5a3d; --heat-off:#3a3541; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131116; --surface:#1d1a21; --surface-2:#2a262f; --fg:#f1eef5; --muted:#a49cb0;
  --line:#35303c; --accent:#ff5a3d; --accent-fg:#1a0703; --ok:#58c98a; --cap:#d9d3e0;
  --heat-on:#ff5a3d; --heat-off:#3a3541; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:1rem; line-height:1.5;
  padding-block:0 4rem;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
button{font:inherit; color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.wrap{max-width:1080px; margin:0 auto}
.mast{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:9; background:var(--bg);
  display:flex; align-items:center; justify-content:space-between; gap:1rem; padding-block:1rem;
  border-bottom:2px solid var(--fg);
}
.brand{font-family:var(--font-display); font-weight:800; font-size:2rem; line-height:1; letter-spacing:0.01em; text-transform:uppercase; margin:0}
.brand span{color:var(--accent)}
.cart-btn{
  display:inline-flex; align-items:center; gap:0.6rem; padding:0.6rem 1rem; background:var(--fg); color:var(--bg);
  border:0; border-radius:6px; cursor:pointer; font:600 0.9375rem var(--font-body);
}
.cart-btn .count{font:500 0.875rem var(--font-mono); background:var(--accent); color:var(--accent-fg); border-radius:999px; min-width:1.5rem; padding:0 0.4rem; text-align:center}
.intro{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:end; gap:1rem; padding-block:2rem 1.25rem}
.intro h2{font-family:var(--font-display); font-weight:700; font-size:clamp(2rem,6vw,3.25rem); line-height:1; margin:0; text-transform:uppercase; max-width:14ch; text-wrap:balance}
.intro p{margin:0; max-width:34ch; color:var(--muted)}
.bar{display:flex; flex-wrap:wrap; gap:0.75rem; align-items:center; padding-bottom:1.25rem}
.bar input[type=search], .bar select{
  font:inherit; color:var(--fg); background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:0.6rem 0.75rem; min-width:0;
}
.bar input[type=search]{flex:1 1 200px}
.seg{display:flex; flex-wrap:wrap; gap:0.375rem}
.seg button{border:1px solid var(--line); background:transparent; color:var(--muted); padding:0.4rem 0.8rem; border-radius:999px; cursor:pointer; font-size:0.875rem}
.seg button[aria-pressed="true"]{background:var(--fg); border-color:var(--fg); color:var(--bg)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1rem; list-style:none; margin:0; padding:0}
.card{background:var(--surface); border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; overflow:hidden; min-width:0}
.art{background:var(--surface-2); display:flex; justify-content:center; padding:1.25rem 1rem 0.75rem; position:relative}
.art svg{width:100%; max-width:130px; height:auto; display:block}
.tag{position:absolute; top:0.6rem; left:0.6rem; font:500 0.6875rem var(--font-mono); text-transform:uppercase; letter-spacing:0.08em; background:var(--fg); color:var(--bg); padding:0.15rem 0.5rem; border-radius:3px}
.info{display:flex; flex-direction:column; gap:0.5rem; padding:0.9rem 1rem 1rem; flex:1}
.info h3{font-family:var(--font-display); font-weight:700; font-size:1.375rem; line-height:1.05; margin:0; text-transform:uppercase}
.info .note{font-size:0.875rem; color:var(--muted); margin:0; flex:1}
.meter{display:flex; align-items:center; gap:0.5rem; font:0.75rem var(--font-mono); color:var(--muted)}
.meter .bars{display:inline-flex; gap:3px}
.meter .bars i{width:14px; height:6px; border-radius:1px; background:var(--heat-off); display:block}
.meter .bars i.on{background:var(--heat-on)}
.buy{display:flex; align-items:center; justify-content:space-between; gap:0.5rem; padding-top:0.25rem}
.price{font:500 1.125rem var(--font-mono); font-variant-numeric:tabular-nums}
.price small{color:var(--muted); font-size:0.75rem}
.add{border:0; background:var(--accent); color:var(--accent-fg); font-weight:600; padding:0.5rem 0.9rem; border-radius:6px; cursor:pointer}
.add:hover{filter:brightness(1.08)}
.empty{grid-column:1/-1; padding:2rem; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:10px}

/* drawer */
.scrim{position:fixed; inset:0; background:rgba(10,6,14,.55); z-index:20; opacity:0; pointer-events:none; transition:opacity .2s}
.scrim.open{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; top:0; right:0; bottom:0; z-index:21; width:min(420px,100%); background:var(--surface); color:var(--fg);
  border-left:2px solid var(--fg); display:flex; flex-direction:column; transform:translateX(102%); transition:transform .25s ease;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); padding-right:env(safe-area-inset-right,0px);
}
.drawer.open{transform:none}
.drawer[hidden]{display:flex!important; visibility:hidden}
.drawer.open[hidden]{visibility:visible}
.d-head{display:flex; justify-content:space-between; align-items:center; padding:1rem 1.25rem; border-bottom:1px solid var(--line)}
.d-head h2{font-family:var(--font-display); font-weight:800; font-size:1.625rem; margin:0; text-transform:uppercase}
.close{border:1px solid var(--line); background:transparent; border-radius:6px; padding:0.35rem 0.7rem; cursor:pointer}
.d-body{flex:1; overflow-y:auto; padding:0.5rem 1.25rem}
.line-item{display:grid; grid-template-columns:48px 1fr auto; gap:0.75rem; align-items:center; padding-block:0.85rem; border-bottom:1px solid var(--line)}
.line-item .thumb{background:var(--surface-2); border-radius:6px; padding:4px; height:56px; display:flex; justify-content:center}
.line-item .thumb svg{height:100%; width:auto}
.line-item h3{margin:0; font-size:0.9375rem; font-weight:600; line-height:1.25}
.line-item .unit{font:0.75rem var(--font-mono); color:var(--muted)}
.qty{display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:6px; margin-top:0.35rem}
.qty button{border:0; background:transparent; width:30px; height:30px; cursor:pointer; font-size:1.125rem}
.qty output{min-width:1.75rem; text-align:center; font:0.875rem var(--font-mono)}
.line-total{text-align:right; font:500 0.9375rem var(--font-mono); font-variant-numeric:tabular-nums}
.remove{display:block; margin-top:0.4rem; border:0; background:transparent; color:var(--muted); font-size:0.75rem; text-decoration:underline; cursor:pointer; margin-left:auto}
.d-empty{color:var(--muted); padding:2rem 0; text-align:center}
.d-foot{border-top:2px solid var(--fg); padding:1rem 1.25rem 1.25rem; display:flex; flex-direction:column; gap:0.6rem}
.promo{display:flex; gap:0.5rem}
.promo input{flex:1; min-width:0; font:0.875rem var(--font-mono); text-transform:uppercase; padding:0.5rem 0.6rem; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px}
.promo button{border:1px solid var(--fg); background:transparent; border-radius:6px; padding:0 0.9rem; cursor:pointer}
.msg{font-size:0.8125rem; min-height:1.2em; margin:0}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--accent)}
.row{display:flex; justify-content:space-between; font-size:0.9375rem}
.row span:last-child{font-family:var(--font-mono); font-variant-numeric:tabular-nums}
.row.total{font-weight:600; font-size:1.125rem; border-top:1px solid var(--line); padding-top:0.6rem}
.ship-note{font-size:0.8125rem; color:var(--muted); margin:0}
.progress{height:4px; background:var(--heat-off); border-radius:2px; overflow:hidden}
.progress i{display:block; height:100%; background:var(--accent); width:0; transition:width .25s}
.checkout{border:0; background:var(--fg); color:var(--bg); font-weight:600; padding:0.8rem; border-radius:6px; cursor:pointer; font-size:1rem}
.checkout:disabled{opacity:.4; cursor:not-allowed}
.done{padding:2rem 1.25rem; display:flex; flex-direction:column; gap:0.75rem}
.done h3{font-family:var(--font-display); font-size:2rem; margin:0; text-transform:uppercase}
.done p{margin:0; color:var(--muted)}
.done .order{font:500 1rem var(--font-mono); color:var(--fg)}
.demo{font:0.75rem var(--font-mono); color:var(--muted); text-align:center; padding-top:2rem}
@media (max-width:480px){ .brand{font-size:1.625rem} .cart-btn{padding:0.5rem 0.75rem} }
@media (prefers-reduced-motion:reduce){ .drawer,.scrim,.progress i{transition:none} }
</style>

<div class="wrap">
  <header class="mast">
    <h1 class="brand">Ember <span>&amp;</span> Ash</h1>
    <button class="cart-btn" id="open-cart" type="button" aria-haspopup="dialog">
      Cart <span class="count" id="count">0</span>
    </button>
  </header>

  <section class="intro">
    <h2>Small-batch hot sauce</h2>
    <p>Fermented, smoked and blended in 150 ml bottles. Heat is rated in Scoville units (SHU) for the sauce, not the raw pepper.</p>
  </section>

  <div class="bar">
    <label for="q" hidden>Search products</label>
    <input id="q" type="search" placeholder="Search sauces, e.g. mango">
    <div class="seg" id="heat-seg" role="group" aria-label="Heat level">
      <button type="button" data-h="all" aria-pressed="true">All heat</button>
      <button type="button" data-h="mild" aria-pressed="false">Mild</button>
      <button type="button" data-h="hot" aria-pressed="false">Hot</button>
      <button type="button" data-h="extreme" aria-pressed="false">Extreme</button>
    </div>
    <label for="sort" hidden>Sort</label>
    <select id="sort">
      <option value="featured">Featured</option>
      <option value="price-asc">Price: low to high</option>
      <option value="price-desc">Price: high to low</option>
      <option value="heat-desc">Heat: highest first</option>
      <option value="heat-asc">Heat: mildest first</option>
    </select>
  </div>
  <div class="seg" id="cat-seg" role="group" aria-label="Category" style="margin-bottom:1.25rem"></div>

  <ul class="grid" id="grid"></ul>
  <p class="demo">Demo store: no payment is taken and nothing ships.</p>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden>
  <div class="d-head"><h2 id="d-title">Your cart</h2><button class="close" id="close-cart" type="button">Close</button></div>
  <div class="d-body" id="d-body"></div>
  <div class="d-foot" id="d-foot"></div>
</aside>

<script>
(function(){
  "use strict";
  var PRODUCTS = [
    {id:"jal", name:"Jalapeño Verde", cat:"Sauces", price:9, heat:2, shu:5000, color:"#3f9b4a", ini:"JV", note:"Roasted green jalapeño, lime and cilantro stems."},
    {id:"chi", name:"Smoked Chipotle", cat:"Sauces", price:10, heat:2, shu:7000, color:"#8a3b1f", ini:"SC", note:"Oak-smoked chipotle in adobo with a touch of molasses."},
    {id:"goc", name:"Gochujang Honey", cat:"Sauces", price:9, heat:1, shu:3000, color:"#b0262b", ini:"GH", note:"Fermented chili paste thinned with wildflower honey.", tag:"New"},
    {id:"fre", name:"Fermented Fresno", cat:"Sauces", price:12, heat:3, shu:25000, color:"#e0552a", ini:"FF", note:"Three-week ferment with garlic. Bright and tangy."},
    {id:"man", name:"Habanero Mango", cat:"Sauces", price:11, heat:3, shu:40000, color:"#f0a21a", ini:"HM", note:"Ripe mango up front, habanero fruitiness behind it.", tag:"Best seller"},
    {id:"pin", name:"Scotch Bonnet Pineapple", cat:"Sauces", price:12, heat:4, shu:60000, color:"#d9b81f", ini:"SP", note:"Grilled pineapple, allspice and thyme."},
    {id:"gho", name:"Ghost Pepper Lime", cat:"Sauces", price:14, heat:5, shu:200000, color:"#7a2a6e", ini:"GL", note:"Fast, sharp heat that clears in under a minute."},
    {id:"rea", name:"Reaper Black Garlic", cat:"Sauces", price:16, heat:5, shu:400000, color:"#241c26", ini:"RB", note:"Carolina Reaper and aged black garlic. Use a toothpick.", tag:"Limited"},
    {id:"cri", name:"Chili Crisp", cat:"Crisps & Oils", price:13, heat:2, shu:8000, color:"#a8321e", ini:"CC", note:"200 g jar of fried shallot, garlic and Sichuan pepper in oil.", jar:true},
    {id:"oil", name:"Smoked Chili Oil", cat:"Crisps & Oils", price:11, heat:3, shu:20000, color:"#c4561b", ini:"SO", note:"Cold-infused over three days. 100 ml.", jar:true},
    {id:"lad", name:"The Heat Ladder", cat:"Sets", price:34, heat:5, shu:0, color:"#d4301c", ini:"HL", note:"Five 50 ml minis, from Gochujang Honey up to Ghost Pepper Lime.", set:true, tag:"Gift set"}
  ];
  var FREE_SHIP = 40, SHIP = 5, PROMO = {code:"HEAT10", pct:10};
  var state = {cart:{}, heat:"all", cat:"All", sort:"featured", q:"", promo:false, done:null};
  try {
    var s = JSON.parse(localStorage.getItem("ember-ash") || "null");
    if (s && s.cart) state.cart = s.cart;
    if (s && s.promo) state.promo = true;
  } catch(e){}
  var $ = function(id){ return document.getElementById(id); };
  var byId = {}; PRODUCTS.forEach(function(p){ byId[p.id] = p; });
  Object.keys(state.cart).forEach(function(k){ if (!byId[k] || !(state.cart[k] > 0)) delete state.cart[k]; });
  function persist(){ try { localStorage.setItem("ember-ash", JSON.stringify({cart:state.cart, promo:state.promo})); } catch(e){} }
  function money(n){ return "$" + n.toFixed(2); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  /* product art, drawn inline */
  function bottle(color, ini, heat, x, y, sc){
    var dots = "";
    for (var i=0;i<5;i++) dots += '<circle cx="'+(34+i*8)+'" cy="124" r="2.6" fill="'+(i<heat?'#d4301c':'#cfc9c4')+'"/>';
    return '<g transform="translate('+x+' '+y+') scale('+sc+')">'+
      '<rect x="40" y="4" width="20" height="14" rx="3" fill="var(--cap)"/>'+
      '<rect x="42" y="18" width="16" height="16" fill="'+color+'"/>'+
      '<path d="M42 32h16v8q24 8 24 30v58q0 6-6 6H24q-6 0-6-6V70q0-22 24-30z" fill="'+color+'"/>'+
      '<rect x="22" y="68" width="56" height="62" rx="3" fill="#f6f3ef"/>'+
      '<rect x="22" y="68" width="56" height="10" fill="'+color+'" opacity=".85"/>'+
      '<text x="50" y="108" text-anchor="middle" font-family="Big Shoulders Display, Arial Narrow, sans-serif" font-weight="800" font-size="26" fill="#1a161d">'+ini+'</text>'+
      dots+'</g>';
  }
  function jar(color, ini, heat){
    var dots = "";
    for (var i=0;i<5;i++) dots += '<circle cx="'+(34+i*8)+'" cy="112" r="2.6" fill="'+(i<heat?'#d4301c':'#cfc9c4')+'"/>';
    return '<rect x="22" y="30" width="56" height="12" rx="3" fill="var(--cap)"/>'+
      '<rect x="16" y="42" width="68" height="88" rx="10" fill="'+color+'"/>'+
      '<rect x="22" y="62" width="56" height="58" rx="3" fill="#f6f3ef"/>'+
      '<text x="50" y="96" text-anchor="middle" font-family="Big Shoulders Display, Arial Narrow, sans-serif" font-weight="800" font-size="26" fill="#1a161d">'+ini+'</text>'+dots;
  }
  function art(p){
    var inner;
    if (p.set){
      var cs = ["#b0262b","#e0552a","#f0a21a","#d9b81f","#7a2a6e"];
      inner = cs.map(function(c,i){ return bottle(c, "", i+1, 2+i*19, 52, 0.36); }).join("");
    } else if (p.jar) inner = jar(p.color, p.ini, p.heat);
    else inner = bottle(p.color, p.ini, p.heat, 0, 0, 1);
    return '<svg viewBox="0 0 100 140" role="img" aria-label="'+esc(p.name)+'" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>';
  }

  function heatBand(p){ return p.heat <= 2 ? "mild" : (p.heat <= 4 ? "hot" : "extreme"); }
  function meter(p){
    var b = ""; for (var i=1;i<=5;i++) b += '<i class="'+(i<=p.heat?'on':'')+'"></i>';
    return '<div class="meter" title="Heat '+p.heat+' of 5"><span class="bars" aria-hidden="true">'+b+'</span><span>'+(p.shu? p.shu.toLocaleString()+' SHU' : 'Heat 1–5')+'</span></div>';
  }

  function visible(){
    var q = state.q.trim().toLowerCase();
    var list = PRODUCTS.filter(function(p){
      if (state.cat !== "All" && p.cat !== state.cat) return false;
      if (state.heat !== "all" && heatBand(p) !== state.heat) return false;
      if (q && (p.name+" "+p.note).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    var s = state.sort;
    if (s === "price-asc") list.sort(function(a,b){ return a.price-b.price; });
    if (s === "price-desc") list.sort(function(a,b){ return b.price-a.price; });
    if (s === "heat-desc") list.sort(function(a,b){ return b.heat-a.heat || b.shu-a.shu; });
    if (s === "heat-asc") list.sort(function(a,b){ return a.heat-b.heat || a.shu-b.shu; });
    return list;
  }

  function renderGrid(){
    var list = visible();
    if (!list.length){ $("grid").innerHTML = '<li class="empty">Nothing matches those filters. Try clearing the search or heat level.</li>'; return; }
    $("grid").innerHTML = list.map(function(p){
      return '<li class="card"><div class="art">'+(p.tag?'<span class="tag">'+esc(p.tag)+'</span>':'')+art(p)+'</div>'+
        '<div class="info"><h3>'+esc(p.name)+'</h3>'+meter(p)+'<p class="note">'+esc(p.note)+'</p>'+
        '<div class="buy"><span class="price">'+money(p.price)+'</span>'+
        '<button class="add" type="button" data-add="'+p.id+'" aria-label="Add '+esc(p.name)+' to cart">Add to cart</button></div></div></li>';
    }).join("");
  }

  function totals(){
    var sub = 0, n = 0;
    Object.keys(state.cart).forEach(function(id){ sub += byId[id].price * state.cart[id]; n += state.cart[id]; });
    var disc = state.promo ? Math.round(sub * PROMO.pct) / 100 : 0;
    var after = sub - disc;
    var ship = n === 0 ? 0 : (after >= FREE_SHIP ? 0 : SHIP);
    return {sub:sub, n:n, disc:disc, after:after, ship:ship, total:after+ship};
  }

  var promoMsg = {t:"", c:""};
  function renderCart(){
    var t = totals(), ids = Object.keys(state.cart);
    $("count").textContent = t.n;
    $("open-cart").setAttribute("aria-label", "Open cart, "+t.n+" item"+(t.n===1?"":"s"));
    if (state.done){
      $("d-body").innerHTML = '<div class="done"><h3>Order placed</h3><p>Thanks for trying the demo. Nothing was charged or shipped.</p>'+
        '<p class="order">'+esc(state.done.id)+'</p><p>'+state.done.n+' item'+(state.done.n===1?'':'s')+' · '+money(state.done.total)+'</p></div>';
      $("d-foot").innerHTML = '<button class="checkout" type="button" id="keep">Keep shopping</button>';
      return;
    }
    if (!ids.length){
      $("d-body").innerHTML = '<p class="d-empty">Your cart is empty. Add a sauce to get started.</p>';
    } else {
      $("d-body").innerHTML = ids.map(function(id){
        var p = byId[id], q = state.cart[id];
        return '<div class="line-item"><div class="thumb">'+art(p)+'</div>'+
          '<div><h3>'+esc(p.name)+'</h3><span class="unit">'+money(p.price)+' each</span>'+
          '<div class="qty"><button type="button" data-dec="'+id+'" aria-label="Decrease quantity of '+esc(p.name)+'">−</button>'+
          '<output aria-live="polite">'+q+'</output>'+
          '<button type="button" data-inc="'+id+'" aria-label="Increase quantity of '+esc(p.name)+'">+</button></div></div>'+
          '<div><div class="line-total">'+money(p.price*q)+'</div><button class="remove" type="button" data-rm="'+id+'">Remove</button></div></div>';
      }).join("");
    }
    var left = Math.max(0, FREE_SHIP - t.after), pct = Math.min(100, t.after / FREE_SHIP * 100);
    $("d-foot").innerHTML =
      (ids.length ? '<div class="progress" aria-hidden="true"><i style="width:'+pct+'%"></i></div>'+
        '<p class="ship-note">'+(left>0 ? 'Add '+money(left)+' more for free shipping.' : 'You get free shipping.')+'</p>' : '')+
      '<form class="promo" id="promo-form"><label for="promo" hidden>Promo code</label>'+
        '<input id="promo" placeholder="Promo code" autocomplete="off" '+(state.promo?'value="'+PROMO.code+'" readonly':'')+'>'+
        '<button type="submit">'+(state.promo?'Remove':'Apply')+'</button></form>'+
      '<p class="msg '+promoMsg.c+'">'+esc(promoMsg.t)+'</p>'+
      '<div class="row"><span>Subtotal</span><span>'+money(t.sub)+'</span></div>'+
      (t.disc? '<div class="row"><span>Promo '+PROMO.code+' (−'+PROMO.pct+'%)</span><span>−'+money(t.disc)+'</span></div>':'')+
      '<div class="row"><span>Shipping</span><span>'+(t.n? (t.ship? money(t.ship):'Free') : '–')+'</span></div>'+
      '<div class="row total"><span>Total</span><span>'+money(t.total)+'</span></div>'+
      '<button class="checkout" type="button" id="checkout"'+(t.n?'':' disabled')+'>Place demo order</button>';
  }

  function change(id, d){
    var q = (state.cart[id] || 0) + d;
    if (q <= 0) delete state.cart[id]; else state.cart[id] = Math.min(q, 20);
    persist(); renderCart();
  }

  /* drawer */
  var lastFocus = null;
  function openCart(){
    lastFocus = document.activeElement;
    var d = $("drawer"); d.hidden = false;
    requestAnimationFrame(function(){ d.classList.add("open"); $("scrim").classList.add("open"); $("close-cart").focus(); });
  }
  function closeCart(){
    $("drawer").classList.remove("open"); $("scrim").classList.remove("open");
    setTimeout(function(){ $("drawer").hidden = true; }, 260);
    if (state.done) state.done = null, renderCart();
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  document.addEventListener("click", function(e){
    var t = e.target.closest("button"); if (!t) return;
    if (t.dataset.add){ var wasEmpty = totals().n === 0; change(t.dataset.add, 1); t.textContent = "Added"; setTimeout(function(){ t.textContent = "Add to cart"; }, 900); }
    else if (t.dataset.inc) change(t.dataset.inc, 1);
    else if (t.dataset.dec) change(t.dataset.dec, -1);
    else if (t.dataset.rm){ delete state.cart[t.dataset.rm]; persist(); renderCart(); }
    else if (t.id === "checkout"){
      var tt = totals();
      state.done = {id:"EA-"+Math.floor(100000+Math.random()*900000), n:tt.n, total:tt.total};
      state.cart = {}; state.promo = false; promoMsg = {t:"",c:""}; persist(); renderCart();
    }
    else if (t.id === "keep") closeCart();
  });
  document.addEventListener("submit", function(e){
    if (e.target.id !== "promo-form") return;
    e.preventDefault();
    if (state.promo){ state.promo = false; promoMsg = {t:"Promo removed.", c:""}; }
    else {
      var v = $("promo").value.trim().toUpperCase();
      if (v === PROMO.code){ state.promo = true; promoMsg = {t:"Promo applied: "+PROMO.pct+"% off.", c:"ok"}; }
      else promoMsg = {t: v ? "That code isn't valid. Try HEAT10." : "Enter a code first.", c:"bad"};
    }
    persist(); renderCart();
  });
  $("open-cart").addEventListener("click", openCart);
  $("close-cart").addEventListener("click", closeCart);
  $("scrim").addEventListener("click", closeCart);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !$("drawer").hidden) closeCart(); });

  /* filters */
  $("q").addEventListener("input", function(e){ state.q = e.target.value; renderGrid(); });
  $("sort").addEventListener("change", function(e){ state.sort = e.target.value; renderGrid(); });
  function seg(id, attr, key){
    $(id).addEventListener("click", function(e){
      var b = e.target.closest("button"); if (!b) return;
      state[key] = b.dataset[attr];
      Array.prototype.forEach.call($(id).children, function(c){ c.setAttribute("aria-pressed", String(c === b)); });
      renderGrid();
    });
  }
  seg("heat-seg","h","heat");
  var cats = ["All"]; PRODUCTS.forEach(function(p){ if (cats.indexOf(p.cat) < 0) cats.push(p.cat); });
  $("cat-seg").innerHTML = cats.map(function(c,i){ return '<button type="button" data-c="'+esc(c)+'" aria-pressed="'+(i===0)+'">'+esc(c)+'</button>'; }).join("");
  seg("cat-seg","c","cat");

  renderGrid(); renderCart();
})();
</script>

</body></html>
