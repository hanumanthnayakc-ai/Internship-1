<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasks</title>
<style>
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#1d2733; --muted:#7a8794; --line:#d9dee4;
  --accent:#1f6f5c; --accent-ink:#ffffff; --danger:#b3382c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14191f; --panel:#1c232b; --ink:#e6ebf0; --muted:#8a97a4; --line:#2c3641;
    --accent:#4fb99f; --accent-ink:#0c1a16; --danger:#ef7d70;
  }
}
:root[data-theme="dark"]{
  --bg:#14191f; --panel:#1c232b; --ink:#e6ebf0; --muted:#8a97a4; --line:#2c3641;
  --accent:#4fb99f; --accent-ink:#0c1a16; --danger:#ef7d70;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:32px 16px}
main{width:100%;max-width:520px}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
.add{display:flex;gap:8px;margin-bottom:16px}
input[type=text]{flex:1;min-width:0;padding:12px 14px;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px}
input[type=text]:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.add button{padding:0 18px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.filters{display:flex;gap:6px;margin-bottom:12px}
.filters button{padding:6px 12px;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;font-size:.85rem}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ul{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li input{width:20px;height:20px;accent-color:var(--accent);flex:none;cursor:pointer}
li span{flex:1;overflow-wrap:anywhere;cursor:pointer}
li.done span{text-decoration:line-through;color:var(--muted)}
li .del{background:transparent;color:var(--muted);font-size:1.2rem;padding:2px 8px}
li .del:hover{color:var(--danger)}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:.9rem}
.foot button{background:transparent;color:var(--muted);text-decoration:underline;padding:4px}
</style>
</head>
<body>
<main>
  <h1>Tasks</h1>
  <p class="sub">Saved in this browser. Reload the page and they stay.</p>

  <div class="add">
    <input id="input" type="text" placeholder="What needs doing?" aria-label="New task" autocomplete="off">
    <button id="addBtn">Add task</button>
  </div>

  <div class="filters" id="filters">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="active" aria-pressed="false">Active</button>
    <button data-f="done" aria-pressed="false">Done</button>
  </div>

  <ul id="list"></ul>

  <div class="foot">
    <span id="count"></span>
    <button id="clearDone">Clear completed</button>
  </div>
</main>

<script>
const KEY = "todo-tasks-v1";
const input = document.getElementById("input");
const list = document.getElementById("list");
const count = document.getElementById("count");

// ---- State ----
let tasks = load();
let filter = "all";

// ---- Storage (wrapped: storage can be empty or blocked) ----
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    const data = raw ? JSON.parse(raw) : [];
    return Array.isArray(data) ? data : [];
  } catch (e) { return []; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
}

// ---- Actions: change state, save, re-render ----
function addTask(text) {
  text = text.trim();
  if (!text) return;
  tasks.push({ id: Date.now() + Math.random(), text, done: false });
  commit();
}
function toggleTask(id) {
  const t = tasks.find(t => t.id === id);
  if (t) t.done = !t.done;
  commit();
}
function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  commit();
}
function commit() { save(); render(); }

// ---- Render: build the DOM from state ----
function render() {
  list.innerHTML = "";
  const visible = tasks.filter(t =>
    filter === "all" ? true : filter === "done" ? t.done : !t.done);

  if (!visible.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = tasks.length ? "Nothing in this view." : "No tasks yet. Type one above and press Enter.";
    list.appendChild(li);
  }

  visible.forEach(t => {
    const li = document.createElement("li");
    if (t.done) li.classList.add("done");
    li.dataset.id = t.id;

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = t.done;
    cb.setAttribute("aria-label", "Mark complete");

    const span = document.createElement("span");
    span.textContent = t.text; // textContent avoids HTML injection

    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "\u00D7";
    del.setAttribute("aria-label", "Delete task");

    li.append(cb, span, del);
    list.appendChild(li);
  });

  const left = tasks.filter(t => !t.done).length;
  count.textContent = left + (left === 1 ? " task left" : " tasks left");
}

// ---- Event listeners ----
document.getElementById("addBtn").addEventListener("click", () => {
  addTask(input.value); input.value = ""; input.focus();
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter") { addTask(input.value); input.value = ""; }
});

// Event delegation: one listener on the list handles every row
list.addEventListener("click", e => {
  const li = e.target.closest("li[data-id]");
  if (!li) return;
  const id = Number(li.dataset.id);
  if (e.target.closest(".del")) deleteTask(id);
  else toggleTask(id);
});

document.getElementById("filters").addEventListener("click", e => {
  const btn = e.target.closest("button[data-f]");
  if (!btn) return;
  filter = btn.dataset.f;
  document.querySelectorAll("#filters button").forEach(b =>
    b.setAttribute("aria-pressed", b === btn));
  render();
});

document.getElementById("clearDone").addEventListener("click", () => {
  tasks = tasks.filter(t => !t.done);
  commit();
});

render();
</script>
</body>
</html>
