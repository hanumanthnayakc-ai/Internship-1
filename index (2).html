<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyline Weather</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: one wide "now" panel over a five-column forecast strip; stacks on phones. */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#e3eaf1; --fg:#14202e; --muted:#5a6b7d;
  --line:#cfd9e3; --accent:#e8890c; --accent-fg:#ffffff; --cool:#2f6fa3; --error:#b3261e;
  --font-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --font-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d151e; --surface:#15212d; --surface-2:#1d2d3d; --fg:#e8eef4; --muted:#93a4b6;
    --line:#2a3b4d; --accent:#f5a33a; --accent-fg:#1a1100; --cool:#6fb0e3; --error:#ff8a80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d151e; --surface:#15212d; --surface-2:#1d2d3d; --fg:#e8eef4; --muted:#93a4b6;
  --line:#2a3b4d; --accent:#f5a33a; --accent-fg:#1a1100; --cool:#6fb0e3; --error:#ff8a80;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:16px; line-height:1.5;
  padding-block:24px 48px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
.wrap{max-width:960px; margin:0 auto; display:flex; flex-direction:column; gap:20px}
header{display:flex; flex-wrap:wrap; gap:12px 16px; align-items:center; justify-content:space-between}
h1{font-family:var(--font-display); font-size:1.5rem; margin:0; letter-spacing:-0.01em}
.tools{display:flex; gap:8px; align-items:center}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface)}
.seg button{border:0; background:transparent; color:var(--muted); font:500 0.875rem var(--font-mono); padding:8px 12px; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg); color:var(--bg)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
form.search{display:flex; gap:8px; flex-wrap:wrap}
.field{position:relative; flex:1 1 240px; min-width:0}
.field input{
  width:100%; padding:12px 14px; font:inherit; color:var(--fg); background:var(--surface);
  border:1px solid var(--line); border-radius:8px;
}
.go{
  padding:12px 20px; font:500 1rem var(--font-body); border:0; border-radius:8px;
  background:var(--accent); color:var(--accent-fg); cursor:pointer;
}
.go:hover{filter:brightness(1.06)}
#results{
  position:absolute; z-index:5; inset:calc(100% + 4px) 0 auto 0; margin:0; padding:4px; list-style:none;
  background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.15);
}
#results button{
  display:block; width:100%; text-align:left; border:0; background:transparent; color:var(--fg);
  font:inherit; padding:10px 12px; border-radius:6px; cursor:pointer;
}
#results button:hover,#results button:focus-visible{background:var(--surface-2)}
#results small{color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips button{
  border:1px solid var(--line); background:transparent; color:var(--muted); font:0.875rem var(--font-body);
  padding:6px 12px; border-radius:999px; cursor:pointer;
}
.chips button:hover{color:var(--fg); border-color:var(--muted)}
.now{
  background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:28px;
  display:grid; grid-template-columns:auto 1fr; gap:24px 32px; align-items:center;
}
.now .icon svg{width:132px; height:132px; display:block}
.place{font-family:var(--font-display); font-size:1.25rem; font-weight:500; margin:0}
.when{font:0.8125rem var(--font-mono); color:var(--muted); text-transform:uppercase; letter-spacing:0.08em}
.temp{font-family:var(--font-display); font-weight:700; font-size:clamp(4rem,12vw,6.5rem); line-height:1; letter-spacing:-0.04em; margin:4px 0}
.temp sup{font-size:0.4em; font-weight:500; color:var(--muted); letter-spacing:0; vertical-align:top; position:relative; top:0.2em}
.cond{font-size:1.125rem; margin:0}
.stats{grid-column:1 / -1; display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; border-top:1px solid var(--line); padding-top:20px}
.stat dt{font:0.75rem var(--font-mono); color:var(--muted); text-transform:uppercase; letter-spacing:0.08em}
.stat dd{margin:2px 0 0; font:500 1.125rem var(--font-mono); font-variant-numeric:tabular-nums}
h2{font:0.8125rem var(--font-mono); text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin:8px 0 0; font-weight:500}
.forecast{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; list-style:none; margin:0; padding:0}
.day{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 12px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center}
.day.today{border-color:var(--accent)}
.day .dow{font:500 0.9375rem var(--font-display)}
.day .date{font:0.75rem var(--font-mono); color:var(--muted)}
.day svg{width:56px; height:56px}
.day .hi{font:500 1.25rem var(--font-mono); font-variant-numeric:tabular-nums}
.day .lo{font:0.9375rem var(--font-mono); color:var(--cool); font-variant-numeric:tabular-nums}
.day .rain{font:0.75rem var(--font-mono); color:var(--muted)}
.day .label{font-size:0.8125rem; color:var(--muted); min-height:2.4em}
.status{padding:20px; border-radius:12px; background:var(--surface); border:1px dashed var(--line); color:var(--muted)}
.status.err{color:var(--error); border-color:var(--error)}
footer{font-size:0.8125rem; color:var(--muted)}
footer a{color:inherit}
.skeleton{opacity:.55}
@media (max-width:720px){
  .forecast{grid-template-columns:repeat(2,minmax(0,1fr))}
  .day:first-child{grid-column:1 / -1}
  .now{grid-template-columns:1fr; padding:20px; justify-items:start}
  .now .icon svg{width:96px; height:96px}
}
@media (prefers-reduced-motion:no-preference){
  .now,.day{animation:rise .4s ease-out both}
  .day:nth-child(2){animation-delay:.04s}.day:nth-child(3){animation-delay:.08s}
  .day:nth-child(4){animation-delay:.12s}.day:nth-child(5){animation-delay:.16s}
  @keyframes rise{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Skyline Weather</h1>
    <div class="tools">
      <div class="seg" role="group" aria-label="Units">
        <button type="button" id="u-c" aria-pressed="true">°C</button>
        <button type="button" id="u-f" aria-pressed="false">°F</button>
      </div>
    </div>
  </header>

  <form class="search" id="search" autocomplete="off">
    <div class="field">
      <label for="q" hidden>City</label>
      <input id="q" type="search" placeholder="Search a city, e.g. Lisbon" aria-autocomplete="list" aria-controls="results">
      <ul id="results" hidden></ul>
    </div>
    <button class="go" type="submit">Search</button>
  </form>

  <div class="chips" id="chips" aria-label="Quick picks"></div>

  <main id="main" aria-live="polite">
    <div class="status">Loading weather…</div>
  </main>

  <footer>
    Data from <a href="https://open-meteo.com/" rel="noopener">Open-Meteo</a>, fetched live in your browser. No API key needed.
  </footer>
</div>

<script>
(function(){
  "use strict";
  var GEO = "https://geocoding-api.open-meteo.com/v1/search";
  var API = "https://api.open-meteo.com/v1/forecast";
  var PRESETS = [
    {name:"London", country:"United Kingdom", lat:51.5072, lon:-0.1276},
    {name:"New York", country:"United States", lat:40.7128, lon:-74.006},
    {name:"Tokyo", country:"Japan", lat:35.6762, lon:139.6503},
    {name:"Sydney", country:"Australia", lat:-33.8688, lon:151.2093},
    {name:"Nairobi", country:"Kenya", lat:-1.2921, lon:36.8219},
    {name:"Reykjavik", country:"Iceland", lat:64.1466, lon:-21.9426}
  ];
  var state = { place:PRESETS[0], unit:"c" };
  try {
    var saved = JSON.parse(localStorage.getItem("skyline") || "null");
    if (saved && saved.place && typeof saved.place.lat === "number") state.place = saved.place;
    if (saved && (saved.unit === "c" || saved.unit === "f")) state.unit = saved.unit;
  } catch(e){}

  var $ = function(id){ return document.getElementById(id); };
  var main = $("main"), qEl = $("q"), resultsEl = $("results");
  var reqId = 0;

  /* WMO weather codes -> {label, kind} */
  function describe(code){
    if (code === 0) return {label:"Clear sky", kind:"clear"};
    if (code === 1) return {label:"Mostly clear", kind:"clear"};
    if (code === 2) return {label:"Partly cloudy", kind:"partly"};
    if (code === 3) return {label:"Overcast", kind:"cloud"};
    if (code === 45 || code === 48) return {label:"Fog", kind:"fog"};
    if (code >= 51 && code <= 57) return {label:"Drizzle", kind:"rain"};
    if (code >= 61 && code <= 67) return {label:"Rain", kind:"rain"};
    if (code >= 71 && code <= 77) return {label:"Snow", kind:"snow"};
    if (code >= 80 && code <= 82) return {label:"Rain showers", kind:"rain"};
    if (code === 85 || code === 86) return {label:"Snow showers", kind:"snow"};
    if (code >= 95) return {label:"Thunderstorm", kind:"storm"};
    return {label:"Unknown", kind:"cloud"};
  }

  /* Inline SVG icons; colors come from the page tokens through currentColor-free fills. */
  function sun(cx,cy,r){
    var rays = "";
    for (var i=0;i<8;i++){
      var a = i*Math.PI/4, x1=cx+Math.cos(a)*(r+5), y1=cy+Math.sin(a)*(r+5), x2=cx+Math.cos(a)*(r+11), y2=cy+Math.sin(a)*(r+11);
      rays += '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'"/>';
    }
    return '<g stroke="var(--accent)" stroke-width="3" stroke-linecap="round">'+rays+'</g><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="var(--accent)"/>';
  }
  function moon(){
    return '<path d="M44 14a24 24 0 1 0 22 36A20 20 0 0 1 44 14z" fill="var(--accent)"/>';
  }
  function cloud(fill){
    return '<path d="M22 58a12 12 0 0 1 1.5-23.9A17 17 0 0 1 56 36a11 11 0 0 1 1 22z" fill="'+fill+'"/>';
  }
  function icon(kind, isDay){
    var body = "", cl = "var(--muted)", drop = "var(--cool)";
    if (kind === "clear") body = isDay ? sun(40,40,15) : moon();
    else if (kind === "partly") body = (isDay ? sun(28,28,11) : '<g transform="translate(-14 -14) scale(.7)">'+moon()+'</g>') + '<g transform="translate(6 8)">'+cloud(cl)+'</g>';
    else if (kind === "cloud") body = '<g transform="translate(0 6)">'+cloud(cl)+'</g>';
    else if (kind === "fog") body = '<g transform="translate(0 -6)">'+cloud(cl)+'</g><g stroke="'+cl+'" stroke-width="4" stroke-linecap="round"><line x1="18" y1="58" x2="62" y2="58"/><line x1="24" y1="67" x2="56" y2="67"/></g>';
    else if (kind === "rain") body = '<g transform="translate(0 -8)">'+cloud(cl)+'</g><g stroke="'+drop+'" stroke-width="4" stroke-linecap="round"><line x1="28" y1="56" x2="24" y2="68"/><line x1="40" y1="56" x2="36" y2="68"/><line x1="52" y1="56" x2="48" y2="68"/></g>';
    else if (kind === "snow") body = '<g transform="translate(0 -8)">'+cloud(cl)+'</g><g fill="'+drop+'"><circle cx="27" cy="60" r="3"/><circle cx="40" cy="66" r="3"/><circle cx="53" cy="60" r="3"/></g>';
    else if (kind === "storm") body = '<g transform="translate(0 -8)">'+cloud(cl)+'</g><path d="M42 50l-9 12h7l-4 11 13-15h-8l5-8z" fill="var(--accent)"/>';
    return '<svg viewBox="0 0 80 80" role="img" aria-label="'+kind+'" xmlns="http://www.w3.org/2000/svg">'+body+'</svg>';
  }

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function deg(n){ return Math.round(n) + "°"; }

  function save(){ try { localStorage.setItem("skyline", JSON.stringify(state)); } catch(e){} }

  function setStatus(msg, isErr){
    main.innerHTML = '<div class="status'+(isErr?' err':'')+'">'+esc(msg)+'</div>';
  }

  function load(){
    var id = ++reqId, p = state.place, f = state.unit === "f";
    main.classList.add("skeleton");
    var url = API + "?latitude="+p.lat+"&longitude="+p.lon+
      "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day"+
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"+
      "&forecast_days=5&timezone=auto"+
      "&temperature_unit="+(f?"fahrenheit":"celsius")+"&wind_speed_unit="+(f?"mph":"kmh");
    fetch(url)
      .then(function(r){ if(!r.ok) throw new Error("Weather service returned "+r.status); return r.json(); })
      .then(function(d){ if (id === reqId) render(d); })
      .catch(function(err){
        if (id !== reqId) return;
        main.classList.remove("skeleton");
        setStatus("Could not load the forecast ("+err.message+"). Check your connection and try again.", true);
      });
  }

  function render(d){
    main.classList.remove("skeleton");
    var c = d.current, u = d.current_units, p = state.place, f = state.unit === "f";
    var info = describe(c.weather_code), isDay = c.is_day === 1;
    var stamp = new Date(c.time).toLocaleString(undefined, {weekday:"long", hour:"numeric", minute:"2-digit"});
    var h = '<section class="now" aria-label="Current weather">'+
      '<div class="icon">'+icon(info.kind,isDay)+'</div>'+
      '<div><p class="when">'+esc(stamp)+' · local time</p>'+
      '<h2 class="place" style="text-transform:none;letter-spacing:0;font-family:var(--font-display);font-size:1.25rem;color:var(--fg);margin:2px 0 0">'+esc(p.name)+(p.country?', '+esc(p.country):'')+'</h2>'+
      '<div class="temp">'+Math.round(c.temperature_2m)+'<sup>°'+(f?'F':'C')+'</sup></div>'+
      '<p class="cond">'+esc(info.label)+'</p></div>'+
      '<dl class="stats" style="margin:0">'+
        stat("Feels like", deg(c.apparent_temperature)+(f?"F":"C"))+
        stat("Humidity", Math.round(c.relative_humidity_2m)+u.relative_humidity_2m)+
        stat("Wind", Math.round(c.wind_speed_10m)+" "+(f?"mph":"km/h"))+
      '</dl></section>';

    h += '<h2>5-day forecast</h2><ol class="forecast">';
    d.daily.time.forEach(function(t,i){
      var di = describe(d.daily.weather_code[i]);
      var dt = new Date(t+"T12:00:00");
      var pr = d.daily.precipitation_probability_max[i];
      h += '<li class="day'+(i===0?' today':'')+'">'+
        '<span class="dow">'+(i===0?'Today':dt.toLocaleDateString(undefined,{weekday:"short"}))+'</span>'+
        '<span class="date">'+dt.toLocaleDateString(undefined,{day:"numeric",month:"short"})+'</span>'+
        icon(di.kind,true)+
        '<span class="label">'+esc(di.label)+'</span>'+
        '<span class="hi">'+deg(d.daily.temperature_2m_max[i])+'</span>'+
        '<span class="lo">'+deg(d.daily.temperature_2m_min[i])+'</span>'+
        '<span class="rain">'+(pr==null?'–':pr)+'% rain</span></li>';
    });
    h += '</ol>';
    main.innerHTML = h;
  }
  function stat(k,v){ return '<div class="stat"><dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd></div>'; }

  function choose(place){
    state.place = place; save();
    resultsEl.hidden = true; qEl.value = "";
    load();
  }

  function search(){
    var q = qEl.value.trim();
    if (q.length < 2){ resultsEl.hidden = true; return Promise.resolve(); }
    return fetch(GEO+"?name="+encodeURIComponent(q)+"&count=5&language=en&format=json")
      .then(function(r){ if(!r.ok) throw new Error("Search failed ("+r.status+")"); return r.json(); })
      .then(function(d){
        var list = d.results || [];
        if (!list.length){
          resultsEl.innerHTML = '<li style="padding:10px 12px;color:var(--muted)">No city found for “'+esc(q)+'”.</li>';
          resultsEl.hidden = false; return;
        }
        resultsEl.innerHTML = "";
        list.forEach(function(r){
          var li = document.createElement("li"), b = document.createElement("button");
          b.type = "button";
          b.innerHTML = esc(r.name)+' <small>'+esc([r.admin1, r.country].filter(Boolean).join(", "))+'</small>';
          b.addEventListener("click", function(){ choose({name:r.name, country:r.country||"", lat:r.latitude, lon:r.longitude}); });
          li.appendChild(b); resultsEl.appendChild(li);
        });
        resultsEl.hidden = false;
        return list;
      })
      .catch(function(err){
        resultsEl.innerHTML = '<li style="padding:10px 12px;color:var(--error)">'+esc(err.message)+'</li>';
        resultsEl.hidden = false;
      });
  }

  var timer;
  qEl.addEventListener("input", function(){ clearTimeout(timer); timer = setTimeout(search, 300); });
  $("search").addEventListener("submit", function(e){
    e.preventDefault();
    search().then(function(list){ if (list && list.length === 1) resultsEl.querySelector("button").click(); });
  });
  document.addEventListener("click", function(e){ if (!e.target.closest(".field")) resultsEl.hidden = true; });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") resultsEl.hidden = true; });

  function setUnit(u){
    state.unit = u; save();
    $("u-c").setAttribute("aria-pressed", String(u==="c"));
    $("u-f").setAttribute("aria-pressed", String(u==="f"));
    load();
  }
  $("u-c").addEventListener("click", function(){ if (state.unit !== "c") setUnit("c"); });
  $("u-f").addEventListener("click", function(){ if (state.unit !== "f") setUnit("f"); });
  $("u-c").setAttribute("aria-pressed", String(state.unit==="c"));
  $("u-f").setAttribute("aria-pressed", String(state.unit==="f"));

  PRESETS.forEach(function(p){
    var b = document.createElement("button");
    b.type = "button"; b.textContent = p.name;
    b.addEventListener("click", function(){ choose(p); });
    $("chips").appendChild(b);
  });

  load();
})();
</script>
</body>
</html>
